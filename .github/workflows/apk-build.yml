name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Validate arm64-v8a outputs only
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          test -d "$APK_DIR"

          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | sort)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK produced"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            base="$(basename "$apk")"
            echo "Found APK: $base"
            if [[ "$base" != *"arm64-v8a"* ]]; then
              echo "Non-arm64 APK detected: $base"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teui-release.jks"

      - name: Sign arm64-v8a APK (v2 + v3)
        id: sign_apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*arm64-v8a*.apk" | head -n1)"
          test -n "$UNSIGNED_APK"

          SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/teui-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature schemes
        env:
          SIGNED_APK: ${{ steps.sign_apk.outputs.signed_apk }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" | tee "$RUNNER_TEMP/apk-verify.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apk-verify.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apk-verify.txt"

      - name: Upload arm64-v8a signed APK
        uses: actions/upload-artifact@v4
        with:
          name: teui-arm64-v8a-apk
          path: ${{ steps.sign_apk.outputs.signed_apk }}
          if-no-files-found: error
