name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Validate arm64-v8a outputs only
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          test -d "$APK_DIR"

          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | sort)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK produced"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            base="$(basename "$apk")"
            echo "Found APK: $base"
            if [[ "$base" != *"arm64-v8a"* ]]; then
              echo "Non-arm64 APK detected: $base"
              exit 1
            fi
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: teui-arm64-v8a-apk
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
